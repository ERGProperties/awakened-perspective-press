name: Book Launch Email Sequence

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-launch-email-sequence
  cancel-in-progress: false

jobs:
  send-sequence:
    runs-on: ubuntu-latest
    steps:
      - name: Process due book launch emails
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu

          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET must be configured in GitHub Secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 70 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/book-launch-sequence"
